name: Build docker image

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manually run' || github.event.head_commit.message }}

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tags
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_TAG=ghcr.io/${repo}/northstar-dedi:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST_TAG=ghcr.io/${repo}/northstar-dedi:latest" >> "$GITHUB_ENV"

      - name: Download server files
        env:
            GH_TOKEN: ${{github.token}}
            SERVER_FILES_TAG: server-files-v1
        run: |
            gh release download "$SERVER_FILES_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "R2N_base.tar.zst" \
            --pattern "R2N_vpk.tar.zst"

            gh release download "$SERVER_FILES_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "sha256sums"
            sha256sum -c sha256sums

            mkdir -p R2N/vpk

            tar --zstd -xf R2N_base.tar.zst -C R2N
            tar --zstd -xf R2N_vpk.tar.zst -C R2N/vpk

            rm -f R2N_base.tar.zst R2N_vpk.tar.zst

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{github.token}}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LATEST_TAG }}
            ${{ env.IMAGE_TAG }}
