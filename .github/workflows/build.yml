name: Build docker image

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manually run' || github.event.head_commit.message }}

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tags
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_TAG=ghcr.io/${repo}/northstar-dedi:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST_TAG=ghcr.io/${repo}/northstar-dedi:latest" >> "$GITHUB_ENV"
          echo "XVFB_IMAGE_TAG=ghcr.io/${repo}/northstar-dedi-xvfb:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "XVFB_IMAGE_LATEST_TAG=ghcr.io/${repo}/northstar-dedi-xvfb:latest" >> "$GITHUB_ENV"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{github.token}}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LATEST_TAG }}
            ${{ env.IMAGE_TAG }}

      - name: Build and publish Xvfb Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile.xvfb
          push: true
          tags: |
            ${{ env.XVFB_IMAGE_LATEST_TAG }}
            ${{ env.XVFB_IMAGE_TAG }}
